[project]
name = "jalebi-server"
version = "0.1.0"
description = "Jalebi orchestrator backend (Flask)"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
jalebi = "jalebi.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jalebi"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
